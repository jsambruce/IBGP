!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 13.0.0.1 255.255.255.255
!
interface Ethernet0/0
 no shutdown
 ip address 3.3.3.1 255.0.0.0
 duplex auto
!
interface Ethernet0/1
 no shutdown
 ip address 2.2.2.2 255.0.0.0
 duplex auto
!
interface Ethernet0/2
 no shutdown
 ip address 30.1.1.1 255.0.0.0
 duplex auto
!
interface Ethernet0/3
 no shutdown
 no ip address
 duplex auto
!
router ospf 1
 network 2.0.0.0 0.255.255.255 area 0
 network 3.0.0.0 0.255.255.255 area 0
 network 13.0.0.1 0.0.0.0 area 0
 network 30.0.0.0 0.255.255.255 area 0
!
router bgp 500
 bgp log-neighbor-changes
 network 30.0.0.0
 neighbor IBGP-PEERS peer-group
 neighbor IBGP-PEERS remote-as 500
 ! BGP neighbor authentication removed from public copy.
 neighbor IBGP-PEERS update-source Loopback0
 neighbor IBGP-PEERS version 4
 neighbor 11.0.0.1 peer-group IBGP-PEERS
 neighbor 12.0.0.1 peer-group IBGP-PEERS
 neighbor 14.0.0.1 peer-group IBGP-PEERS
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
!
!
end
