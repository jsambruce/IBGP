!
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 11.0.0.1 255.255.255.255
!
interface Ethernet0/0
 no shutdown
 ip address 1.1.1.1 255.0.0.0
 duplex auto
!
interface Ethernet0/1
 no shutdown
 ip address 4.4.4.2 255.0.0.0
 duplex auto
!
interface Ethernet0/2
 no shutdown
 ip address 10.1.1.1 255.0.0.0
 duplex auto
!
interface Ethernet0/3
 no shutdown
 no ip address
 shutdown
 duplex auto
!
router ospf 1
 network 1.0.0.0 0.255.255.255 area 0
 network 4.0.0.0 0.255.255.255 area 0
 network 10.0.0.0 0.255.255.255 area 0
 network 11.0.0.1 0.0.0.0 area 0
!
router bgp 500
 bgp log-neighbor-changes
 network 10.0.0.0
 neighbor NEXT peer-group
 neighbor NEXT remote-as 500
 ! BGP neighbor authentication removed from public copy.
 neighbor NEXT update-source Loopback0
 neighbor NEXT version 4
 neighbor 12.0.0.1 peer-group NEXT
 neighbor 13.0.0.1 peer-group NEXT
 neighbor 14.0.0.1 peer-group NEXT
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
!
!
end
